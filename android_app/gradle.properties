# ---- 手机端编译的关键配置 ----

# 内存：手机可用内存有限，别让 Gradle 吃太多
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
# 关掉常驻守护进程，编译完就释放内存（代价是每次构建慢十几秒）
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.caching=true

# ★ 最关键的一行：aarch64 上 Google 的 aapt2 只有 x86_64 版，
#   必须指向本机（Termux）原生的 aapt2，否则报 Exec format error
android.aapt2FromMavenOverride=/opt/android-build/aapt2-native/aapt2

android.nonTransitiveRClass=true
android.useAndroidX=false

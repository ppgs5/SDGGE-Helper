plugins { id 'com.android.application' }

android {
    namespace 'com.ggen.helper'
    compileSdk 34

    defaultConfig {
        applicationId "com.ggen.helper"
        minSdk 24
        targetSdk 34
        versionCode 102
        versionName "0.102"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // 零依赖：纯系统 API（WebView + assets 自定义拦截）
}
